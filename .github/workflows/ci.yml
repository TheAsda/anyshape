name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs: every push to master keeps its full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # All four Vitest projects: unit and recipes in Node, react and
    # recipes-react in Chromium (browser mode). The image ships Chromium and
    # its system packages, so no browser download or apt runs here.
    runs-on: ubuntu-latest
    container:
      # The tag must be the Playwright version bun.lock pins; the check step
      # below fails with this reminder when the two drift apart.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      # setup-bun extracts its download with unzip, which the image does not
      # ship; npm is already there. The version is the one the packageManager
      # field in package.json pins.
      - run: npm install --global bun@"$(node -p 'require("./package.json").packageManager.split("bun@")[1]')"
      - run: bun install --frozen-lockfile
      # Fails when the image tag and the installed Playwright have drifted,
      # with the tag to move, instead of a missing executable mid-suite.
      - run: bun run check:image
      - run: bun run test
      - name: Upload failure screenshots
        # Both browser projects write their screenshots under .vitest/.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-failure-screenshots
          path: .vitest/
          # .vitest/ is a dot-directory: skipped unless hidden files are on.
          include-hidden-files: true
          if-no-files-found: ignore

  typecheck:
    # The type-level tests (typeOnlyChecks, @ts-expect-error) run only here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    # oxlint (errors only, module boundaries included) and the oxfmt check,
    # as separate steps so a failure names which one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  package:
    # The package check (NF1) on the tarball npm would publish: its contents,
    # one copy of the core, no react in the core entry, consumers with and
    # without react, publint and @arethetypeswrong/cli.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check:package

  examples:
    # The examples import the library's source through aliases, so their
    # build catches broken aliases and recipe imports as well as types.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [basic, evolution]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The library source resolves its own imports from the root node_modules.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: examples/${{ matrix.example }}
      - run: bun run build
        working-directory: examples/${{ matrix.example }}

  bench:
    # Informational: CI timing is too noisy to fail the build on.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run bench | tee bench.txt
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: bench.txt
          if-no-files-found: ignore
